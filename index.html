<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Análisis - Ingreso y Registro</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="public/css/login.css">
  <!-- CSS de la Pantalla de Carga -->
  <link rel="stylesheet" href="public/css/loader.css">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
</head>

<body>

  <div class="login-main-container">
    <div class="row g-0 w-100 h-100 shadow-lg overflow-hidden login-card-wrapper">
      
      <!-- Columna Izquierda: Ilustración y Branding -->
      <div class="col-lg-6 login-left-panel d-none d-lg-flex flex-column justify-content-between p-4">
        <div class="brand-top d-flex align-items-center gap-3">
          <img src="public/img/icon.png" alt="Logotipo" class="img-fluid logo-img" style="max-height: 50px;">
          <div>
            <h2 class="h5 text-white mb-0 fw-bold">Sistema de Análisis de Hemoglobina</h2>
            <small class="text-white-50">Tecnología que cuida tu salud</small>
          </div>
        </div>

        <div class="text-center my-auto">
          <img src="public/img/Walle-HB.png" alt="Mascota del sistema" class="img-fluid mascot-img" style="max-height: 320px;">
        </div>

        <div class="footer-features text-white-50 small d-flex justify-content-around border-top border-light border-opacity-10 pt-3">
          <span>✔ Diagnósticos rápidos</span>
          <span>✔ Atención personal</span>
          <span>✔ Historial de tus Diagnósticos</span>
        </div>
      </div>

      <!-- Columna Derecha: Formulario de Ingreso -->
      <div class="col-lg-6 login-right-panel bg-white d-flex flex-column justify-content-center p-4 p-md-5">
        
        <div class="header text-start mb-4">
          <h1 class="fw-bold text-dark">Bienvenido</h1>
          <p class="text-muted">Ingresa a tu cuenta para continuar</p>
        </div>

        <form id="formSistema">
          <!-- LOGIN -->
          <div class="form-group mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input id="correo" type="email" class="form-control" required name="email" placeholder="ejemplo@correo.com">
          </div>
          
          <div class="form-group mb-3">
            <label class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" required name="password" placeholder="••••••••">
          </div>

          <!-- REGISTRO -->
          <div class="divider my-4">
            <div class="divider-title text-uppercase fw-semibold mb-2">Datos de Registro</div>
            <div class="form-group mb-3">
              <label class="form-label">Rol en el Sistema</label>
              <select id="rol" name="rol" class="form-select" required>
                <option value="" disabled selected>Selecciona tu rol</option>
                <option value="Paciente">Paciente</option>
                <option value="Medico">Médico</option>
                <option value="Administrador">Administrador</option>
              </select>
            </div>
          </div>

          <!-- BOTONES -->
          <button type="submit" name="accion" value="login" class="btn btn-primary btn-custom-primary w-100 py-2 mb-3">
            Iniciar Sesión
          </button>
        </form>

        <div class="text-center mt-2">
          <hr class="text-muted">
          <a href="view/Registro.html" class="btn btn-outline-secondary btn-custom-secondary w-100 py-2 mb-2">
            Registrar nuevo paciente
          </a>
          <a href="forgetpassword.html" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
        </div>

      </div>

    </div>
  </div>

  <script src="public/js/config.js"></script>
  <!-- Script de la Pantalla de Carga -->
  <script src="public/js/loader.js"></script>
  
  <script>
    // Aseguramos que el loader esté inyectado en el DOM desde el inicio
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof inicializarLoader === "function") {
        inicializarLoader();
      }
    });

    document.getElementById("formSistema").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("correo").value;
      const password = document.getElementById("password").value;
      const rol = document.getElementById("rol").value;

      // 1. Mostramos la pantalla de carga de inmediato
      if (typeof mostrarLoader === "function") {
        mostrarLoader("Validando credenciales...");
      }

      // 2. Damos un respiro al motor del navegador para que renderice el spinner
      await new Promise(resolve => setTimeout(resolve, 180));

      try {
        const respuesta = await fetch(`${API_URL}Autenticacion/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ 
            email: email, 
            password: password, 
            rol: rol 
          })
        });

        const datos = await respuesta.json();

        if (respuesta.ok) {
          // Actualizamos el mensaje del loader con éxito
          if (typeof mostrarLoader === "function") {
            mostrarLoader("¡Bienvenido " + (datos.nombre || "") + "!");
          }

          // Guardar datos en localStorage
          localStorage.setItem("token_seguridad", datos.token);
          localStorage.setItem("usuario_id", datos.idEntidad);

          // Pausa visual de 800ms antes de redirigir
          setTimeout(() => {
            if (typeof ocultarLoader === "function") {
              ocultarLoader();
            }
            if (datos.rol === "Paciente") {
              window.location.href = "view/Monitoreo.html";
            } else if (datos.rol === "Medico") {
              window.location.href = "view/Pagina_Medicos.html";
            } else if (datos.rol === "Administrador") {
              window.location.href = "view/Pagina_Administrador.html";
            }
          }, 800);

        } else {
          if (typeof ocultarLoader === "function") {
            ocultarLoader();
          }
          alert(datos.mensaje || "Error 400: Datos incorrectos o formato inválido.");
          console.error("Detalle del error 400:", datos);
        }
      } catch (error) {
        if (typeof ocultarLoader === "function") {
          ocultarLoader();
        }
        console.error(error);
        alert("No se pudo conectar con el servidor de la API.");
      }
    });
  </script>

</body>

</html>
