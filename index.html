<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Análisis - Ingreso y Registro</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <link rel="stylesheet" href="public/css/login.css">
  <!-- CSS de la Pantalla de Carga -->
  <link rel="stylesheet" href="public/css/loader.css">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
</head>

<body>

  <div class="card">
    <div class="header">
      <h1>Sistema de Análisis</h1>
      <p>Registro e Ingreso</p>
    </div>

    <form id="formSistema">
      <!-- LOGIN -->
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input id="correo" type="email" required name="email" placeholder="ejemplo@correo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="password" type="password" required name="password" placeholder="••••••••">
      </div>

      <!-- REGISTRO -->
      <div class="divider">
        <div class="divider-title">Datos de Registro</div>
        <div class="form-group">
          <label>Rol en el Sistema</label>
          <select id="rol" name="rol" required>
            <option value="" disabled selected>Selecciona tu rol</option>
            <option value="Paciente">Paciente</option>
            <option value="Medico">Médico</option>
            <option value="Administrador">Administrador</option>
          </select>
        </div>
      </div>

      <!-- BOTONES -->
      <button type="submit" name="accion" value="login" class="btn-primary">
        Iniciar Sesión
      </button>
    </form>
    <hr>
    <a href="view/Registro.html" class="btn btn-secondary">
      Registrar nuevo paciente
    </a>
  </div>

  <script src="public/js/config.js"></script>
  <!-- Script de la Pantalla de Carga -->
  <script src="public/js/loader.js"></script>
  
  <script>
    // Aseguramos que el loader esté inyectado en el DOM desde el inicio
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof inicializarLoader === "function") {
        inicializarLoader();
      }
    });

    document.getElementById("formSistema").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("correo").value;
      const password = document.getElementById("password").value;
      const rol = document.getElementById("rol").value;

      // 1. Mostramos la pantalla de carga de inmediato
      if (typeof mostrarLoader === "function") {
        mostrarLoader("Validando credenciales...");
      }

      // 2. Damos un respiro al motor del navegador para que renderice el spinner
      await new Promise(resolve => setTimeout(resolve, 60));

      try {
        const respuesta = await fetch(`${API_URL}Autenticacion/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ 
            email: email, 
            password: password, 
            rol: rol 
          })
        });

        const datos = await respuesta.json();

        if (respuesta.ok) {
          // Actualizamos el mensaje del loader con éxito
          if (typeof mostrarLoader === "function") {
            mostrarLoader("¡Bienvenido " + (datos.nombre || "") + "!");
          }

          // Guardar datos en localStorage
          localStorage.setItem("token_seguridad", datos.token);
          localStorage.setItem("usuario_id", datos.idEntidad);

          // Pausa visual de 800ms antes de redirigir
          setTimeout(() => {
            if (typeof ocultarLoader === "function") {
              ocultarLoader();
            }
            if (datos.rol === "Paciente") {
              window.location.href = "view/Monitoreo.html";
            } else if (datos.rol === "Medico") {
              window.location.href = "view/Pagina_Medicos.html";
            } else if (datos.rol === "Administrador") {
              window.location.href = "view/Pagina_Administrador.html";
            }
          }, 800);

        } else {
          if (typeof ocultarLoader === "function") {
            ocultarLoader();
          }
          alert(datos.mensaje || "Error 400: Datos incorrectos o formato inválido.");
          console.error("Detalle del error 400:", datos);
        }
      } catch (error) {
        if (typeof ocultarLoader === "function") {
          ocultarLoader();
        }
        console.error(error);
        alert("No se pudo conectar con el servidor de la API.");
      }
    });
  </script>

</body>

</html>
