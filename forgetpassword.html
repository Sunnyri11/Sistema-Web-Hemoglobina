<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: min-content;
        height: 100vh;
    }

    .container {
        background-color: #ffffff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
        margin: 20px;
    }

    h2 {
        color: #1f2937;
        font-size: 1.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    p {
        color: #4b5563;
        font-size: 0.875rem;
        text-align: center;
        line-height: 1.25rem;
        margin-bottom: 1.5rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    label {
        display: block;
        color: #374151;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    input[type="email"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 0.875rem;
        outline: none;
        transition: all 0.2s;
    }

    input[type="email"]:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
        width: 100%;
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #1d4ed8;
    }

    .footer {
        margin-top: 1.5rem;
        text-align: center;
        border-top: 1px solid #e5e7eb;
        padding-top: 1.25rem;
    }

    .btn-back {
        color: #6b7280;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        transition: color 0.2s;
    }

    .btn-back:hover {
        color: #374151;
    }

    .alert {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 6px;
        font-size: 0.875rem;
        text-align: center;
        display: none;
    }

    .alert-success {
        background-color: #def7ec;
        color: #03543f;
    }

    .alert-error {
        background-color: #fde8e8;
        color: #9b1c1c;
    }
</style>

<body>

    <div class="container">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Introduce tu correo electrónico y te enviaremos las instrucciones para restablecerla.</p>

        <form id="forgotPasswordForm" onsubmit="enviarFormulario(event)">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
            </div>

            <button type="submit">Restablecer contraseña</button>
        </form>

        <div id="mensajeExito" class="alert alert-success"></div>
        <div id="mensajeError" class="alert alert-error"></div>

        <div class="footer">
            <a href="index.html" class="btn-back">
                ← Volver al inicio
            </a>
        </div>
    </div>

    <script src="public/js/config.js"></script>
    <script>
        async function enviarFormulario(event) {
            event.preventDefault();
            const correo = document.getElementById('correo').value;
            const msgExito = document.getElementById('mensajeExito');
            const msgError = document.getElementById('mensajeError');

            msgExito.style.display = 'none';
            msgError.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}Email/olvidocontraseña/${encodeURIComponent(correo)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    msgExito.innerText = "Si el correo existe, se han enviado las instrucciones.";
                    msgExito.style.display = 'block';
                    document.getElementById('forgotPasswordForm').reset();
                }
                else if (response.status === 400) {
                    msgError.innerText = "El correo no existe en el sistema.";
                    msgError.style.display = 'block';
                }
                else {
                    msgError.innerText = "Ocurrió un error en el servidor. Inténtalo de nuevo.";
                    msgError.style.display = 'block';
                }
            } catch (error) {
                msgError.innerText = "Error de red. No se pudo conectar con el servidor.";
                msgError.style.display = 'block';
            }
        }
    </script>
</body>

</html>
