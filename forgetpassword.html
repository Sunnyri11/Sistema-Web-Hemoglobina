<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Sistema HB</title>
    <link rel="stylesheet" href="public/css/recuperacion.css">
</head>

<body>
    <main class="tarjeta">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p class="sub">Introduce tu correo electrónico y te enviaremos las instrucciones para restablecerla.</p>

        <div id="aviso" class="aviso" hidden role="alert"></div>

        <form id="forgotPasswordForm" novalidate>
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com" autocomplete="email">
            </div>
            <button type="submit" id="btnEnviar" class="btn-principal">Restablecer contraseña</button>
        </form>

        <div class="pie"><a href="index.html">← Volver al inicio</a></div>
    </main>

    <script src="public/js/config.js"></script>
    <script type="module" src="public/js/olvido.js"></script>
</body>

</html>
