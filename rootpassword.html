<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        h2 {
            color: #1f2937;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        p {
            color: #6b7280;
            text-align: center;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Modales de Estado emergentes */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .modal-text {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 1.5rem;
        }

        .btn-modal {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .success-bg {
            color: #046c4e;
        }

        .success-btn {
            background: #046c4e;
        }

        .error-bg {
            color: #9b1c1c;
        }

        .error-btn {
            background: #9b1c1c;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Nueva Contraseña</h2>
        <p>Crea una contraseña segura para proteger tu cuenta.</p>

        <form id="resetForm" onsubmit="procesarRestablecimiento(event)">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar nueva contraseña</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••" minlength="6">
            </div>
            <button type="submit">Guardar cambios</button>
        </form>
    </div>

    <!-- VENTANITA FLOTANTE (MODAL SUCCES / ERROR) -->
    <div id="statusModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalText" class="modal-text"></p>
            <button id="modalBtn" class="btn-modal" onclick="cerrarModal()">Entendido</button>
        </div>
    </div>
    <script src="public/js/config.js"></script>
    <script>
        // Dirección base de tu API local o de producción (Modifícala si usas otro puerto)

        // Leer el correo cifrado directamente desde la URL (?correo=...)
        const urlParams = new URLSearchParams(window.location.search);
        const correoCifrado = urlParams.get('correo');

        // Referencias al modal
        const modal = document.getElementById('statusModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalBtn = document.getElementById('modalBtn');
        let esExito_Global = false;

        async function procesarRestablecimiento(event) {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 1. Validar que la URL contenga el token del correo
            if (!correoCifrado) {
                mostrarAlerta("Error de acceso", "El enlace de recuperación es inválido o faltan parámetros.", false);
                return;
            }

            // 2. Validar coincidencia de contraseñas en el cliente
            if (password !== confirmPassword) {
                mostrarAlerta("Las contraseñas no coinciden", "Asegúrate de escribir exactamente lo mismo en ambos campos.", false);
                return;
            }

            try {
                // Preparamos los parámetros codificados para la URL del endpoint
                const correoParam = encodeURIComponent(correoCifrado);
                const passParam = encodeURIComponent(password);

                // 3. Petición POST al endpoint correspondiente
                const response = await fetch(`${API_URL}Email/restablecercontraseña/${correoParam}/${passParam}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    esExitoGlobal = true;
                    mostrarAlerta("¡Éxito!", data.mensaje || "Tu contraseña se ha cambiado correctamente. Redirigiendo...", true);
                    // Redirigir automáticamente al index tras 3 segundos
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3000);
                } else {
                    esExitoGlobal = false;
                    // 4. Captura el mensaje específico del BadRequest ("La nueva contraseña no puede ser igual a la anterior.")
                    const mensajeError = data.mensaje || data.error || "Ocurrió un error inesperado al procesar la solicitud.";
                    mostrarAlerta("No se pudo cambiar", mensajeError, false);
                }
            } catch (error) {
                esExitoGlobal = false;
                mostrarAlerta("Error de conexión", "No se pudo establecer comunicación con el servidor backend.", false);
            }
        }

        function mostrarAlerta(titulo, mensaje, esExito) {
            modalTitle.innerText = titulo;
            modalText.innerText = mensaje;

            // Limpiar clases previas
            modalTitle.className = "modal-title " + (esExito ? "success-bg" : "error-bg");
            modalBtn.className = "btn-modal " + (esExito ? "success-btn" : "error-btn");

            modal.style.display = 'flex';
        }

        function cerrarModal() {
            modal.style.display = 'none';
            if (esExitoGlobal) {
                window.location.href = "index.html";
            }
        }
    </script>
</body>

</html>
