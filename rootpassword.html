<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Sistema HB</title>
    <link rel="stylesheet" href="public/css/formularios.css">
    <link rel="stylesheet" href="public/css/recuperacion.css">
</head>

<body>
    <main class="tarjeta">
        <h1>Nueva contraseña</h1>
        <p class="sub">Crea una contraseña segura para proteger tu cuenta.</p>

        <div id="aviso" class="aviso" hidden role="alert"></div>

        <form id="resetForm" novalidate>
            <div class="campo">
                <label for="password">Nueva contraseña</label>
                <div class="campo-password">
                    <input type="password" id="password" maxlength="16" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="btn-ojo" data-toggle-password="password" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="fuerza"><div class="fuerza-barra" id="fuerzaBarra"></div><span class="fuerza-texto" id="fuerzaTexto"></span></div>
                <span class="ayuda">De 8 a 16 caracteres, con mayúscula, minúscula, número y un carácter especial.</span>
            </div>
            <div class="campo">
                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="campo-password">
                    <input type="password" id="confirmPassword" maxlength="16" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="btn-ojo" data-toggle-password="confirmPassword" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btnGuardar" class="btn-principal">Guardar cambios</button>
        </form>

        <div class="pie"><a href="index.html">← Volver al inicio</a></div>
    </main>

    <script src="public/js/config.js"></script>
    <script type="module" src="public/js/restablecer.js"></script>
</body>

</html>
