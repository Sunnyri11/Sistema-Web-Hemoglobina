<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema HB - Panel Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../public/css/medicos.css">
</head>
<body>

    <nav>
        <div class="logo">Sistema <span>HB</span></div>
        <button id="EditarPerfil" class="btn btn-warning" onclick="editarPefil()">Editar Perfil</button>
        <button id="btnCerrarSesion" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>

    <main>
        <!-- BANNER DE BIENVENIDA -->
        <div class="banner">
            <div>
                <p style="color: #818cf8; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">
                    Área Médica
                </p>
                <h1 id="txtMedico">Cargando Panel...</h1>
                <p>Gestión epidemiológica y monitoreo de niveles de hemoglobina.</p>
            </div>
            <div class="counter-box" title="Total de pacientes asignados a tu cuenta médica">
                <span class="counter-title">Pacientes</span>
                <span id="lblTotalPacientes" class="counter-number">0</span>
            </div>
        </div>

        <!-- REJILLA DE DASHBOARD -->
        <div class="dashboard-grid">
            
            <!-- PANEL 1: GRÁFICO GLOBAL -->
            <div class="card">
                <h3>Estado Clínico Global</h3>
                <div class="chart-container">
                    <div id="graficoDonut" class="css-donut" style="background: conic-gradient(#e2e8f0 0% 100%);" title="Distribución porcentual de los estados clínicos"></div>
                    <div id="mensajeSinPacientes" style="display: none; color: #64748b; font-size: 13px;">
                        No hay suficientes datos para graficar.
                    </div>

                    <div class="chart-legends">
                        <div class="legend-item"><span class="dot" style="background: var(--color-normal);"></span> Normal</div>
                        <div class="legend-item"><span class="dot" style="background: var(--color-anemia);"></span> Anemia</div>
                        <div class="legend-item"><span class="dot" style="background: var(--color-poliglobulia);"></span> Poliglobulia</div>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: SECCIÓN DE PACIENTES (MIS PACIENTES / AÑADIR PACIENTES) -->
            <div class="card">
                <!-- PESTAÑAS DE NAVEGACIÓN -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">
                    <div style="display: flex; gap: 15px;">
                        <button id="tabMisPacientes" class="tab-btn active" style="font-weight: 600; font-size: 15px; background: none; border: none; padding: 5px 10px; cursor: pointer; color: #1e293b; border-bottom: 2px solid #818cf8; margin-bottom: -12px;" onclick="cambiarPestana('mis-pacientes')">
                            Mis Pacientes
                        </button>
                        <button id="tabAnadirPacientes" class="tab-btn" style="font-weight: 500; font-size: 15px; background: none; border: none; padding: 5px 10px; cursor: pointer; color: #64748b; margin-bottom: -12px;" onclick="cambiarPestana('anadir-pacientes')">
                            Añadir Pacientes
                        </button>
                    </div>

                    <!-- FILTRO DE BÚSQUEDA INTEGRADO -->
                    <div class="search-box" style="position: relative;">
                        <input type="text" id="txtBuscarPaciente" placeholder="Buscar paciente por nombre..." 
                               style="padding: 6px 12px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; width: 220px; outline: none; transition: border 0.2s;"
                               onfocus="this.style.borderColor='#818cf8'" onblur="this.style.borderColor='#cbd5e1'" oninput="filtrarPacientes()">
                    </div>
                </div>

                <!-- CONTENIDO 1: MIS PACIENTES ASIGNADOS -->
                <div id="vistaMisPacientes" class="tab-content">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Paciente</th>
                                    <th style="text-align: center;">Tipo de Sangre</th>
                                    <th style="text-align: center;">Ciudad</th>
                                    <th style="text-align: center;">Analisis</th>
                                    <th style="text-align: center;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="listaPacientes">
                                <!-- Se genera dinámicamente desde medicos.js -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- CONTENIDO 2: AÑADIR NUEVOS PACIENTES -->
                <div id="vistaAnadirPacientes" class="tab-content" style="display: none;">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Paciente</th>
                                    <th style="text-align: center;">Tipo de Sangre</th>
                                    <th style="text-align: center;">Ciudad</th>
                                    <th style="text-align: center;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="listaPacientesGlobales">
                                <!-- Se genera dinámicamente desde la función cargarPacientes() -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../public/js/config.js"></script>
    <script type="module" src="../public/js/medicos.js"></script>
</body>
</html>
