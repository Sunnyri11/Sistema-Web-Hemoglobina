<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Monitoreo - Hemoglobina</title>
  
  <link rel="stylesheet" href="../public/css/monitoreo.css">
</head>
<body>

  <div class="container">
    <div class="left-section">
      <div>
        <h1>Sistema de Monitoreo</h1>
        <div class="subtitle">Panel de Control de Usuario</div>
        <div class="paciente-info" id="infoPaciente">
          <p style="text-align: center; color: var(--text-muted);">Sincronizando expediente con el servidor central...</p>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-analisis" onclick="abrirModalAnalisis()">
          Realizar Análisis Clínico
        </button>
        <!-- Función de descarga de reporte PDF -->
        <button class="btn btn-reportes" onclick="descargarReportePDF()">
          Ver Reportes Históricos
        </button>
        <button class="btn btn-logout" id="btnCerrarSesion">
          Cerrar Sesión
        </button>
      </div>
    </div>

    <div class="right-section">
      <h3>Evolución de Niveles de Hemoglobina</h3>
      <div class="chart-container" style="position: relative; height:320px; width:100%;">
        <canvas id="graficoHemoglobina"></canvas>
      </div>
    </div>
  </div>

  <div id="modalAnalisis" class="modal-overlay">
    <div class="modal-box">
      <button class="btn-close-modal" onclick="cerrarModalAnalisis()">&times;</button>
      <h2 id="modalTitulo">Vincular Dispositivo Médico</h2>
      <p id="modalMensaje">Por favor, ingrese manualmente el código identificador de su sensor biométrico para iniciar.</p>
      
      <div id="inputSection">
        <input type="text" id="txtSensorId" class="input-codigo" placeholder="Escriba el código del sensor..." autocomplete="off">
        <button class="btn btn-analisis" style="background-color: var(--primary);" onclick="iniciarVinculacionManual()">
          Vincular Código
        </button>
      </div>

      <div id="loaderSection" class="spinner-box">
        <div class="spinner" id="iconoCarga"></div>
        <h4 id="loaderTexto" style="color: var(--primary); font-weight: 700; margin-bottom: 12px;">Conectando...</h4>
        
        <button id="btnGuardarSQL" class="btn" style="background-color: var(--success); color: #fff; display: none; width: 80%; margin: 10px auto 0 auto;" onclick="ejecutarGuardadoDefinitivo()">
          Guardar Análisis
        </button>
      </div>
    </div>
  </div>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/paciente.js"></script>
</body>
</html>
