<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Paciente - Hemoglobina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <link rel="stylesheet" href="../public/css/registro.css">
  <!-- CSS de la Pantalla de Carga -->
  <link rel="stylesheet" href="../public/css/loader.css">
</head>

<body>
  <div class="card">
    <div class="header-title">
      <h1>Sistema de Análisis</h1>
      <p>Registro de Nuevo Usuario</p>
    </div>

    <form id="formRegistro" novalidate>
      <div class="form-group">
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" name="nombre" required maxlength="30" placeholder="Ej. Carlos">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="apellido_paterno">Apellido Paterno</label>
          <input type="text" id="apellido_paterno" name="apellido_paterno" maxlength="30" placeholder="Ej. Pérez">
        </div>
        <div class="form-group">
          <label for="apellido_materno">Apellido Materno</label>
          <input type="text" id="apellido_materno" name="apellido_materno" maxlength="30" placeholder="Ej. Gómez">
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Género biológico</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="genero" value="Masculino" checked> Hombre
            </label>
            <label class="radio-option">
              <input type="radio" name="genero" value="Femenino"> Mujer
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="departamento">Departamento</label>
          <select id="departamento" name="departamento" onchange="cargarProvincias()" required>
            <option value="" disabled selected>Cargando departamentos...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="provincia">Ciudad</label>
          <select id="provincia" name="provincia" onchange="actualizarAltitud()" required>
            <option value="" disabled selected>Seleccione depto primero</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="altitud">Altitud (m.s.n.m.)</label>
        <input type="number" id="altitud" name="altitud" min="0" placeholder="Ej. 3600" required>
        <span class="helper-text">Modificable según la localidad exacta. No se permiten valores negativos.</span>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" required maxlength="30" placeholder="ejemplo@correo.com">
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required maxlength="16" placeholder="••••••••">
        <span class="helper-text">De 8 a 16 caracteres, al menos una mayúscula, una minúscula, un número y un carácter especial.</span>
      </div>

      <!-- Confirmar Contraseña -->
      <div class="form-group">
        <label for="confirm_password">Confirmar Contraseña</label>
        <input type="password" id="confirm_password" name="confirm_password" required maxlength="16" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="rol">Rol en el Sistema</label>
        <select id="rol" name="rol" required onchange="Selector()">
          <option value="" disabled selected>Seleccione el Rol</option>
          <option value="Paciente">Paciente</option>
          <option value="Medico">Médico</option>
        </select>
      </div>

      <div id="contenedorTipoSangre" class="form-group" style="display: none; margin-top: 16px;">
        <label for="Tipo_Sangre">Tipo de Sangre</label>
        <select id="Tipo_Sangre" name="Tipo_Sangre">
          <option value="" disabled selected>Seleccione su tipo de sangre</option>
          <optgroup label="Grupo O">
            <option value="O+">O Positivo (O+)</option>
            <option value="O-">O Negativo (O-)</option>
          </optgroup>
          <optgroup label="Grupo A">
            <option value="A+">A Positivo (A+)</option>
            <option value="A-">A Negativo (A-)</option>
          </optgroup>
          <optgroup label="Grupo B">
            <option value="B+">B Positivo (B+)</option>
            <option value="B-">B Negativo (B-)</option>
          </optgroup>
          <optgroup label="Grupo AB">
            <option value="AB+">AB Positivo (AB+)</option>
            <option value="AB-">AB Negativo (AB-)</option>
          </optgroup>
          <option value="Desconocido">No sabe</option>
        </select>
      </div>

      <!-- Contenedor Oculto de Especialidades (Solo se activa si el Rol es Medico) -->
      <div id="contenedorEspecialidad" class="form-group" style="display: none; margin-top: 16px;">
        <label for="especialidad">Especialidad Médica</label>
        <select id="especialidad" name="especialidad">
          <option value="" disabled selected>Seleccione especialidad</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Registrar Usuario</button>
    </form>
    <hr>
    <a class="btn btn-primary" href="../index.html">Iniciar Sesión</a>
  </div>

  <script src="../public/js/config.js"></script>
  <!-- Script de la Pantalla de Carga -->
  <script src="../public/js/loader.js"></script>

  <script src="../public/js/register.js"> </script>
</body>
</html>
